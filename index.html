<html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Youth Action Council TLR</title>
    <script src="titleChanger.js"></script>
    <style>
      body {
        background-color: rgb(255, 0, 255);
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        color: #ffffff;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .container {
        text-align: center;
        padding: 20px;
        border: 1px solid #333333;
        border-radius: 10px;
        background-color: #1e1e1e;
        max-width: 1200px;
        width: 90%;
        margin: 20px;
      }
      img {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        border: 2px solid black;
        background-color: rgba(255, 255, 255, 1);
      }
      h1 {
        font-size: 22px;
        margin: 10px 0;
        color: #ff69b4;
      }
      p {
        color: #ccc;
      }
      #bio3 {
        font-weight: bold;
        font-size: 1.2em;
      }
      footer {
        font-size: 0.8e,;
        color: #aaa;
        margin-top: 20px;
      }
      .link {
        display: block;
        text-decoration: none;
        color: white;
        background: #444;
        padding: 10px;
        margin: 10px 0;
        border-radius: 5px;
        transition: background 0.3s;
      }
      .link:hover {
        background: #666;
      }
      .hearts {
        font-size: 24px;
        margin-bottom: 10px;
      }
      ul { 
        list-style: none;
        padding: 0;
      }
      ul li::before {
        content: "\2655";
        color: white;
        margin-right: 8px;
      }
      </style>
  </head>
  <body>
    <div class="container">
      <div class="hearts">insert</div>
      <img
        src="."
        alt="YAC Logo"
      />
      <h1 id="name">Youth Action Council TLR</h1>
      <div class="bio">
        <p id="bio1">Official Group of Grand Haven High School</p>
        <p id="bio3">TLR Information"</p>
      </div>
      <a href="https://rb.gy/qyjipj" class="link">Download TLR Guidelines</a>
      <a href="#" class="link">.</a>
